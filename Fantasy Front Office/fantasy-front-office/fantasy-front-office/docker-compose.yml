services:
  fantasy-front-office:
    build: .
    ports:
      - "8080:8080"
    # Values come from a .env file next to this one if it exists.
    # Without .env the game still runs, with offline (non-AI) negotiators.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
    volumes:
      - league-data:/app/data
    restart: unless-stopped

volumes:
  league-data:
